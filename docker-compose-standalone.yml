# docker-compose-standalone.yml
# All-in-one single-machine deployment of codePost.
# Includes: nginx reverse proxy, API, Celery worker, shell relay, Redis,
# MariaDB, Flower dashboard, and autoheal.
#
# Usage:
#   1. Copy .env.example to .env and fill in all values.
#   2. Place TLS certs in ./certs/ (fullchain.pem, privkey.pem)
#      or remove the codepost-entry service to run without TLS.
#   3. docker compose -f docker-compose-standalone.yml up -d --build
#
# For smaller deployments you can reduce innodb_buffer_pool_size below.

services:
    # ─── Reverse Proxy ─────────────────────────────────────────────────
    codepost-entry:
        image: nginx:latest
        container_name: codepost-entry
        volumes:
            - ./certs:/etc/ssl/certs:ro
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            codepost-api:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── API Server ────────────────────────────────────────────────────
    codepost-api:
        container_name: codepost-api
        build:
            context: .
            target: api
        env_file:
            - .env
        environment:
            - DEBUG=${DEBUG:-FALSE}
            - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - AUTOGRADER_AUTO_EXECUTE=True
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - DB_NAME=codepost
            - DB_HOSTNAME=codepost-database
            - DB_PORT=3306
            - DB_USERNAME=codepost_user
            - DB_PASSWORD=${DB_PASSWORD}
            - SECRET_KEY=${SECRET_KEY}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
            - EMAIL_HOST=${EMAIL_HOST}
            - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM}
            - HOST_STAGING_ROOT=/tmp/codepost-staging
            - WORKER_STAGING_ROOT=/staging
            - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
            - WORKER_DATASET_ROOT=/assignment_datasets
            - WORKER_SHELL_REDIS_URL=redis://codepost-redis:6379
            - WORKER_SHELL_SHARED_SECRET=${WORKER_SHELL_SHARED_SECRET}
        ports:
            - "8000:8000"
        volumes:
            - datasets:/assignment_datasets
            - staging:/staging
        labels:
            - "autoheal=true"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health-check"]
            interval: 30s
            timeout: 10s
            retries: 5
        depends_on:
            codepost-database:
                condition: service_healthy
            codepost-redis:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── Celery Worker ─────────────────────────────────────────────────
    codepost-worker:
        container_name: codepost-worker
        build:
            context: .
            target: worker
        privileged: true
        env_file:
            - .env
        environment:
            - DEBUG=False
            - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - DB_NAME=codepost
            - DB_HOSTNAME=codepost-database
            - DB_PORT=3306
            - DB_USERNAME=codepost_user
            - DB_PASSWORD=${DB_PASSWORD}
            - SECRET_KEY=${SECRET_KEY}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
            - EMAIL_HOST=${EMAIL_HOST}
            - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM}
            - HOST_STAGING_ROOT=/tmp/codepost-staging
            - WORKER_STAGING_ROOT=/staging
            - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
            - WORKER_DATASET_ROOT=/assignment_datasets
            - WORKER_SHELL_SHARED_SECRET=${WORKER_SHELL_SHARED_SECRET}
        volumes:
            - datasets:/assignment_datasets
            - staging:/staging
            - /var/run/docker.sock:/var/run/docker.sock
        labels:
            - "autoheal=true"
        healthcheck:
            test: ["CMD", "celery", "--app", "autograder", "status"]
            interval: 30s
            timeout: 10s
            retries: 5
        depends_on:
            codepost-database:
                condition: service_healthy
            codepost-redis:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── Shell Relay (interactive terminal sessions) ───────────────────
    codepost-worker-shell:
        container_name: codepost-worker-shell
        build:
            context: .
            target: worker
        command: ["python", "-m", "autograder.worker_shell_relay"]
        privileged: true
        env_file:
            - .env
        environment:
            - DEBUG=False
            - DB_NAME=codepost
            - DB_HOSTNAME=codepost-database
            - DB_PORT=3306
            - DB_USERNAME=codepost_user
            - DB_PASSWORD=${DB_PASSWORD}
            - HOST_STAGING_ROOT=/tmp/codepost-staging
            - WORKER_STAGING_ROOT=/staging
            - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
            - WORKER_DATASET_ROOT=/assignment_datasets
            - WORKER_SHELL_SHARED_SECRET=${WORKER_SHELL_SHARED_SECRET}
            - WORKER_SHELL_REDIS_URL=redis://codepost-redis:6379
            - WORKER_SHELL_WORKER_ID=${WORKER_SHELL_WORKER_ID:-standalone}
        volumes:
            - datasets:/assignment_datasets
            - staging:/staging
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            codepost-redis:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── Redis ─────────────────────────────────────────────────────────
    codepost-redis:
        image: redis:7-alpine
        container_name: codepost-redis
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── MariaDB ───────────────────────────────────────────────────────
    codepost-database:
        image: mariadb:11
        container_name: codepost-database
        env_file:
            - .env
        environment:
            - MARIADB_ROOT_PASSWORD=${ROOT_DATABASE_PASSWORD}
            - MARIADB_DATABASE=codepost
            - MARIADB_USER=codepost_user
            - MARIADB_PASSWORD=${DB_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
        command:
            - --innodb_page_size=16k
            - --innodb_buffer_pool_size=${INNODB_BUFFER_POOL_SIZE:-2G}
            - --innodb_log_file_size=256M
            - --max_connections=${DB_MAX_CONNECTIONS:-500}
            - --wait_timeout=600
            - --interactive_timeout=3600
        healthcheck:
            test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "--silent", "--user=root", "--password=${ROOT_DATABASE_PASSWORD}"]
            interval: 10s
            timeout: 10s
            retries: 10
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── Flower (Celery monitoring) ────────────────────────────────────
    codepost-flower:
        container_name: codepost-flower
        build:
            context: .
            target: flower
        environment:
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - FLOWER_BASIC_AUTH=${API_USER}:${API_PASSWORD}
        ports:
            - "5555:5555"
        healthcheck:
            test: ["CMD-SHELL", "curl -f -u \"$$FLOWER_BASIC_AUTH\" http://localhost:5555/ || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
        depends_on:
            codepost-redis:
                condition: service_healthy
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ─── Autoheal (auto-restart unhealthy containers) ──────────────────
    codepost-autoheal:
        image: willfarrell/autoheal:latest
        container_name: codepost-autoheal
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    redis-data:
    db-data:
    datasets:
    staging:
