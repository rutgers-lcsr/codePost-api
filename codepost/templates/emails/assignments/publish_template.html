{% extends "emails/base_template.html" %}
{% block content %}
    <h2 class="text-2xl font-semibold mb-4">Hey {{ user.username }},</h2>
    <p>A new assignment {{ assignment.name }} has been released for you! please follow the link below:</p>
    <p class="mb-4">
        <a href="{{ client_url }}/student/{{ assignment.course.name }}/{{ assignment.course.period }}"
           class="btn">View Assignments</a>
    </p>
{% endblock content %}
