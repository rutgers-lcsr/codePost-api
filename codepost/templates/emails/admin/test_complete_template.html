{% extends "emails/base_template.html" %}
{% block content %}
    <div class="p-6">
        <h1 class="text-2xl font-bold mb-4">
            Run All Completed for assignment <strong>{{ assignment_name }}</strong> in <strong>{{ course_name }}</strong> - <strong>{{ course_period }}</strong>!
        </h1>
        <p class="text-gray-700 mb-4">See test results below:</p>
        <p class="mb-4">
            <a href="{{ client_url }}/admin/{{ course_name }}/{{ course_period }}/assignments/tests/{{ assignment_name }}/results"
               class="btn">Click Here</a>
        </p>
    </div>
{% endblock content %}
