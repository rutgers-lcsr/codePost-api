<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodePost Email</title>
    <meta name="description" content="Email notification from CodePost.">
    <meta name="keywords" content="CodePost, email, notification, contact">
    <style>
      .body {
        background-color: #f0fdf4;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;

      }
      .container {
        max-width: 400px;
        margin: 40px auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        overflow: hidden;
        padding: 32px 24px;
      }
      .header {
        text-align: left;
        padding-left: 24px;
        padding-top: 16px;
        margin-bottom: 24px;
      }
      .btn-red {
        display: inline-block;
        padding: 12px 28px;
        background-color: #b91010ff;
        color: #fff !important;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        box-shadow: 0 1px 4px rgba(16,185,129,0.08);
      }
      .btn-red:hover,
      .btn-red:focus {
        background-color: #780404ff;
        color: #e0f2fe !important;
        text-decoration: none;
      }
      .btn {
        display: inline-block;
        padding: 12px 28px;
        background-color: #10b981;
        color: #fff !important;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        box-shadow: 0 1px 4px rgba(16,185,129,0.08);
      }
      .btn:hover,
      .btn:focus {
        background-color: #047857;
        color: #e0f2fe !important;
        text-decoration: none !important;
      }
      a {
        color: #2563eb;
        text-decoration: none;
        transition: color 0.2s;
      }
      a:hover {
        color: #1d4ed8;
        text-decoration: underline;
      }

      .brand-link {
        font-size: 2rem;
        font-weight: bold;
        color: #10b981;
        text-decoration: none;
        letter-spacing: 1px;
        transition: color 0.2s;
      }
      .brand-link:hover,
      .brand-link:focus {
        color: #047a55ff !important;
        text-decoration: none !important;
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.5) !important;
      }
      
      .footer {
        text-align: center;
        color: #64748b;
        margin-top: 32px;
        font-size: 0.95rem;
        width: 100%;
        padding: 16px;
      }
    </style>
  </head>
  <body class="body">
    <div>
      <div class="header">
        <a href="{{ client_url }}" class="brand-link">CodePost</a>
      </div>
      <div class="container">
        {% block content %}
        {% endblock content %}
      </div>
      <div class="footer">
        <p>
          If you have any questions, feel free to
          <a href="{{ client_url }}/contact">contact us</a>
        </p>
      </div>
    </div>
  </body>
</html>
