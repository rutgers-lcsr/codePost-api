# Deploy to Production Server (API)
#
# Branching model:
#   main              — day-to-day development, auto-deploys to dev server
#   release/<version> — cut from main via "Create Release Branch" workflow
#
# Release flow:
#   1. Run "Create Release Branch" workflow to cut release/<version> from main
#   2. Test on the release branch (CI runs automatically)
#   3. Run THIS workflow with ref=release/<version> and version=<version>
#   4. This deploys to production, creates a git tag v<version>, creates a
#      GitHub Release, and triggers SDK regeneration in codePost-ui and
#      codepost-python via repository_dispatch
#
# Hotfix flow:
#   1. Fix the bug on main first
#   2. Cherry-pick the fix onto the active release branch
#   3. Re-run THIS workflow with the same ref and an incremented patch version
#
# Runners: production-data, production-api, production-workers, testing-codepost

name: Deploy to Production Server

on:
    workflow_dispatch:
        inputs:
            ref:
                description: "Branch or tag to deploy (e.g., release/3.4.0)"
                required: true
            version:
                description: "Version tag to create after deploy (e.g., 3.4.0)"
                required: true

concurrency:
    group: deploy-production-api
    cancel-in-progress: false

jobs:
    deploy_data:
        environment: production
        runs-on: production-data
        env:
            ROOT_DATABASE_PASSWORD: ${{ secrets.ROOT_DATABASE_PASSWORD }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            API_USER: ${{ vars.API_USER }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  ROOT_DATABASE_PASSWORD=${{ secrets.ROOT_DATABASE_PASSWORD }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  EOF
            - name: Deploy docker containers for database, redis, adminer, and flower
              run: |
                  docker compose -f docker-compose-data.yml build
                  docker compose -f docker-compose-data.yml up -d --remove-orphans --wait --wait-timeout 180
            - name: Remove docker artifacts
              run: |
                  docker system prune -f
            - name: Notify database deployment success
              run: echo "Database deployment to production server successful!"
    deploy:
        needs: [deploy_data]
        environment: production
        runs-on: production-api
        env:
            DEBUG: false
            API_URL: ${{ vars.API_URL }}
            CLIENT_URL: ${{ vars.CLIENT_URL }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            API_USER: ${{ vars.API_USER }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            SECRET_KEY: ${{ secrets.SECRET_KEY }}
            EMAIL_HOST: ${{ vars.EMAIL_HOST }}
            DEFAULT_EMAIL_FROM: ${{ vars.DEFAULT_EMAIL_FROM }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            WORKER_SHELL_SHARED_SECRET: ${{ secrets.WORKER_SHELL_SHARED_SECRET }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Set up Certs
              run: |
                  HOSTNAME=$(hostname)
                  cp -rflT /etc/letsencrypt/live/$HOSTNAME/ certs/

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  DEBUG=${{ env.DEBUG }}
                  API_URL=${{ vars.API_URL }}
                  CLIENT_URL=${{ vars.CLIENT_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  EMAIL_HOST=${{ vars.EMAIL_HOST }}
                  DEFAULT_EMAIL_FROM=${{ vars.DEFAULT_EMAIL_FROM }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  WORKER_SHELL_SHARED_SECRET=${{ secrets.WORKER_SHELL_SHARED_SECRET }}
                  EOF

            - name: Build and deploy
              run: |
                  docker compose -f docker-compose-prod.yml build 
                  docker compose -f docker-compose-prod.yml up -d --remove-orphans --wait --wait-timeout 180

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify deployment success
              run: echo "Deployment to production server successful!"
    deploy_workers:
        needs: [deploy]
        environment: production
        runs-on: production-workers
        env:
            DEBUG: false
            API_URL: ${{ vars.API_URL }}
            CLIENT_URL: ${{ vars.CLIENT_URL }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            EMAIL_HOST: ${{ vars.EMAIL_HOST }}
            DEFAULT_EMAIL_FROM: ${{ vars.DEFAULT_EMAIL_FROM }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            CELERY_CONCURRENCY: ${{ vars.CELERY_CONCURRENCY }}
            WORKER_SHELL_SHARED_SECRET: ${{ secrets.WORKER_SHELL_SHARED_SECRET }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  DEBUG=${{ env.DEBUG }}
                  API_URL=${{ vars.API_URL }}
                  CLIENT_URL=${{ vars.CLIENT_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
                  EMAIL_HOST=${{ vars.EMAIL_HOST }}
                  DEFAULT_EMAIL_FROM=${{ vars.DEFAULT_EMAIL_FROM }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  CELERY_CONCURRENCY=${{ vars.CELERY_CONCURRENCY }}
                  WORKER_SHELL_SHARED_SECRET=${{ secrets.WORKER_SHELL_SHARED_SECRET }}
                  EOF

            - name: Build and deploy workers only
              run: |
                  docker compose -f docker-compose-worker.yml build
                  docker compose -f docker-compose-worker.yml up -d --remove-orphans --wait --wait-timeout 180

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify workers deployment success
              run: echo "Workers deployment to production server successful!"

    tag-and-notify:
        needs: [deploy_workers]
        runs-on: testing-codepost
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0

            - name: Create and push version tag
              run: |
                  git tag "v${{ inputs.version }}"
                  git push origin "v${{ inputs.version }}"

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "v${{ inputs.version }}" \
                    --target "${{ inputs.ref }}" \
                    --title "v${{ inputs.version }}" \
                    --generate-notes

            - name: Trigger TypeScript client update
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
              run: |
                  gh api repos/${{ github.repository_owner }}/codePost-ui/dispatches \
                    -f event_type=api-release \
                    -f 'client_payload[version]=v${{ inputs.version }}' \
                    -f 'client_payload[schema_url]=https://codepost-api.cs.rutgers.edu/api/schema/'

            - name: Trigger Python SDK update
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
              run: |
                  gh api repos/${{ github.repository_owner }}/codepost-python/dispatches \
                    -f event_type=api-release \
                    -f 'client_payload[version]=v${{ inputs.version }}' \
                    -f 'client_payload[schema_url]=https://codepost-api.cs.rutgers.edu/api/schema/'
