# Deploy to Production Server (API)
#
# Branching model:
#   main              — day-to-day development, auto-deploys to dev server
#   release/<version> — cut from main via "Create Release Branch" workflow
#
# Release flow:
#   1. Run "Create Release Branch" workflow to cut release/<version> from main
#   2. Test on the release branch (CI runs automatically)
#   3. Run THIS workflow and enter release/<version> in the "branch" input
#      (defaults to the ref it was dispatched from). The head of that branch
#      is what gets deployed; its name determines the version tag.
#   4. This deploys to production, creates a git tag v<version>, creates a
#      GitHub Release, and triggers SDK regeneration in codePost-ui and
#      codepost-python via repository_dispatch
#
# Hotfix flow:
#   1. Fix the bug on main first
#   2. Cherry-pick the fix onto the active release branch
#   3. Bump the release branch to release/<new-version> (or re-cut) and re-run
#      this workflow against it
#
# Runners: production-data, production-api, production-workers, testing-codepost

name: Deploy to Production Server

on:
    workflow_dispatch:
        inputs:
            branch:
                description: "release/<version> branch to deploy (defaults to the ref this workflow is dispatched from)"
                required: false

concurrency:
    group: deploy-production-api
    cancel-in-progress: false

jobs:
    prepare:
        runs-on: testing-codepost
        outputs:
            version: ${{ steps.meta.outputs.version }}
            branch: ${{ steps.meta.outputs.branch }}
        steps:
            - name: Validate branch and derive version
              id: meta
              run: |
                  branch="${{ inputs.branch }}"
                  branch="${branch:-$GITHUB_REF_NAME}"
                  if [[ "$branch" != release/* ]]; then
                      echo "::error::Production deploys must target a release/<version> branch. Got: ${branch}"
                      exit 1
                  fi
                  if ! git ls-remote --exit-code "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "refs/heads/${branch}" > /dev/null; then
                      echo "::error::Branch ${branch} does not exist on origin."
                      exit 1
                  fi
                  version="${branch#release/}"
                  echo "branch=${branch}" >> "$GITHUB_OUTPUT"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "Deploying ${branch} as v${version}"

    deploy_data:
        needs: [prepare]
        environment: production
        runs-on: production-data
        env:
            ROOT_DATABASE_PASSWORD: ${{ secrets.ROOT_DATABASE_PASSWORD }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            API_USER: ${{ vars.API_USER }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.branch }}

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  ROOT_DATABASE_PASSWORD=${{ secrets.ROOT_DATABASE_PASSWORD }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  EOF
            - name: Deploy docker containers for database, redis, adminer, and flower
              run: |
                  docker compose -f docker-compose-data.yml build
                  docker compose -f docker-compose-data.yml up -d --remove-orphans --wait --wait-timeout 180
            - name: Remove docker artifacts
              run: |
                  docker system prune -f
            - name: Notify database deployment success
              run: echo "Database deployment to production server successful!"
    deploy:
        needs: [prepare, deploy_data]
        environment: production
        runs-on: production-api
        env:
            DEBUG: false
            API_URL: ${{ vars.API_URL }}
            CLIENT_URL: ${{ vars.CLIENT_URL }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            API_USER: ${{ vars.API_USER }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            SECRET_KEY: ${{ secrets.SECRET_KEY }}
            EMAIL_HOST: ${{ vars.EMAIL_HOST }}
            DEFAULT_EMAIL_FROM: ${{ vars.DEFAULT_EMAIL_FROM }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            WORKER_SHELL_SHARED_SECRET: ${{ secrets.WORKER_SHELL_SHARED_SECRET }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.branch }}

            - name: Set up Certs
              run: |
                  HOSTNAME=$(hostname)
                  cp -rflT /etc/letsencrypt/live/$HOSTNAME/ certs/

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  DEBUG=${{ env.DEBUG }}
                  API_URL=${{ vars.API_URL }}
                  CLIENT_URL=${{ vars.CLIENT_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  EMAIL_HOST=${{ vars.EMAIL_HOST }}
                  DEFAULT_EMAIL_FROM=${{ vars.DEFAULT_EMAIL_FROM }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  WORKER_SHELL_SHARED_SECRET=${{ secrets.WORKER_SHELL_SHARED_SECRET }}
                  EOF

            - name: Build and deploy
              run: |
                  docker compose -f docker-compose-prod.yml build 
                  docker compose -f docker-compose-prod.yml up -d --remove-orphans --wait --wait-timeout 180

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify deployment success
              run: echo "Deployment to production server successful!"
    deploy_workers:
        needs: [prepare, deploy]
        environment: production
        runs-on: production-workers
        env:
            DEBUG: false
            API_URL: ${{ vars.API_URL }}
            CLIENT_URL: ${{ vars.CLIENT_URL }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            EMAIL_HOST: ${{ vars.EMAIL_HOST }}
            DEFAULT_EMAIL_FROM: ${{ vars.DEFAULT_EMAIL_FROM }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            CELERY_CONCURRENCY: ${{ vars.CELERY_CONCURRENCY }}
            WORKER_SHELL_SHARED_SECRET: ${{ secrets.WORKER_SHELL_SHARED_SECRET }}
            # Interpolated by compose into codepost-ai-worker ONLY — deliberately
            # NOT written to .env, so the autograder container never sees it.
            FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.branch }}

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  DEBUG=${{ env.DEBUG }}
                  API_URL=${{ vars.API_URL }}
                  CLIENT_URL=${{ vars.CLIENT_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  EMAIL_HOST=${{ vars.EMAIL_HOST }}
                  DEFAULT_EMAIL_FROM=${{ vars.DEFAULT_EMAIL_FROM }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  CELERY_CONCURRENCY=${{ vars.CELERY_CONCURRENCY }}
                  WORKER_SHELL_SHARED_SECRET=${{ secrets.WORKER_SHELL_SHARED_SECRET }}
                  EOF

            - name: Build and deploy workers only
              run: |
                  docker compose -f docker-compose-worker.yml build
                  docker compose -f docker-compose-worker.yml up -d --remove-orphans --wait --wait-timeout 180

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify workers deployment success
              run: echo "Workers deployment to production server successful!"

    tag-and-notify:
        needs: [prepare, deploy_workers]
        runs-on: testing-codepost
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.prepare.outputs.branch }}
                  fetch-depth: 0

            - name: Create and push version tag
              run: |
                  git tag "v${VERSION}"
                  git push origin "v${VERSION}"

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "v${VERSION}" \
                    --target "${{ needs.prepare.outputs.branch }}" \
                    --title "v${VERSION}" \
                    --generate-notes

            - name: Trigger TypeScript client update
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
              run: |
                  gh api "repos/${{ github.repository_owner }}/codePost-ui/dispatches" \
                    -f event_type=api-release \
                    -f "client_payload[version]=v${VERSION}" \
                    -f 'client_payload[schema_url]=https://codepost-api.cs.rutgers.edu/api/schema/'

            - name: Trigger Python SDK update
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
              run: |
                  gh api "repos/${{ github.repository_owner }}/codepost-python/dispatches" \
                    -f event_type=api-release \
                    -f "client_payload[version]=v${VERSION}" \
                    -f 'client_payload[schema_url]=https://codepost-api.cs.rutgers.edu/api/schema/'
