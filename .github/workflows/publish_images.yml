#
# Publish Docker images to GitHub Container Registry on release tags.
# Triggered by pushing a tag matching v* (e.g., v3.2.0).
# Builds three targets: api, worker, flower.

name: Publish Docker Images

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/codepost

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                target: [api, worker, flower]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Extract version from tag
              id: version
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: ${{ matrix.target }}
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ steps.version.outputs.version }}
                      ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
