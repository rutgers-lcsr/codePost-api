# Deploy to Development Server (API)
#
# Triggers automatically on every push to main. Deploys the latest commit
# to the development environment (data, api, and worker runners).
#
# Related workflows:
#   - test_codepost.yml runs CI on the same branches
#   - deploy_production.yml is triggered manually for production releases
#
# Runners: development-data, development-api, development-workers

name: Deploy to Development Server

on:
    push:
        branches:
            - main

jobs:
    deploy_data:
        environment: development
        runs-on: development-data
        env:
            ROOT_DATABASE_PASSWORD: ${{ secrets.ROOT_DATABASE_PASSWORD }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            API_USER: ${{ vars.API_USER }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            DEV_DOCKER: ${{ vars.DEV_DOCKER }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  ROOT_DATABASE_PASSWORD=${{ secrets.ROOT_DATABASE_PASSWORD }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  EOF
            - name: Deploy docker containers for database, redis, adminer, and flower
              run: |
                  docker compose -f docker-compose-data.yml build
                  docker compose -f docker-compose-data.yml up -d --remove-orphans
            - name: Remove docker artifacts
              run: |
                  docker system prune -f
            - name: Notify database deployment success
              run: echo "Database deployment to development server successful!"
    deploy:
        environment: development
        runs-on: development-api
        env:
            DEBUG: true
            DEV_DOCKER: true
            API_URL: ${{ vars.API_URL }}
            CLIENT_URL: ${{ vars.CLIENT_URL }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            API_USER: ${{ vars.API_USER }}
            API_PASSWORD: ${{ secrets.API_PASSWORD }}
            SECRET_KEY: ${{ secrets.SECRET_KEY }}
            EMAIL_HOST: ${{ vars.EMAIL_HOST }}
            DEFAULT_EMAIL_FROM: ${{ vars.DEFAULT_EMAIL_FROM }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            WORKER_SHELL_SHARED_SECRET: ${{ secrets.WORKER_SHELL_SHARED_SECRET }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Certs
              run: |
                  HOSTNAME=$(hostname)
                  cp -rflT /etc/letsencrypt/live/$HOSTNAME/ certs/

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  DEBUG=${{ env.DEBUG }}
                  API_URL=${{ vars.API_URL }}
                  CLIENT_URL=${{ vars.CLIENT_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  API_USER=${{ vars.API_USER }}
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  EMAIL_HOST=${{ vars.EMAIL_HOST }}
                  DEFAULT_EMAIL_FROM=${{ vars.DEFAULT_EMAIL_FROM }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  WORKER_SHELL_SHARED_SECRET=${{ secrets.WORKER_SHELL_SHARED_SECRET }}
                  EOF

            - name: Build and deploy
              run: |
                  docker compose build
                  docker compose up -d --remove-orphans
                  # Restart the nginx container due to 502 Bad Gateway errors
                  docker restart codepost-entry

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify deployment success
              run: echo "Deployment to development server successful!"
    deploy_workers:
        environment: development
        runs-on: development-workers
        env:
            DEBUG: true
            DEV_DOCKER: true
            API_URL: ${{ vars.API_URL }}
            CLIENT_URL: ${{ vars.CLIENT_URL }}
            DB_HOSTNAME: ${{ vars.DB_HOSTNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            ROOT_DATABASE_PASSWORD: ${{ secrets.ROOT_DATABASE_PASSWORD }}
            FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
            EMAIL_HOST: ${{ vars.EMAIL_HOST }}
            DEFAULT_EMAIL_FROM: ${{ vars.DEFAULT_EMAIL_FROM }}
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            CELERY_CONCURRENCY: ${{ vars.CELERY_CONCURRENCY }}
            WORKER_SHELL_SHARED_SECRET: ${{ secrets.WORKER_SHELL_SHARED_SECRET }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up .env
              run: |
                  cat <<EOF > .env
                  DEBUG=${{ env.DEBUG }}
                  DEV_DOCKER=${{ env.DEV_DOCKER }}
                  API_URL=${{ vars.API_URL }}
                  CLIENT_URL=${{ vars.CLIENT_URL }}
                  SECRET_KEY=${{ secrets.SECRET_KEY }}
                  DB_HOSTNAME=${{ vars.DB_HOSTNAME }}
                  DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  ROOT_DATABASE_PASSWORD=${{ secrets.ROOT_DATABASE_PASSWORD }}
                  API_USER=${{ vars.API_USER }}   
                  API_PASSWORD=${{ secrets.API_PASSWORD }}
                  EMAIL_HOST=${{ vars.EMAIL_HOST }}
                  DEFAULT_EMAIL_FROM=${{ vars.DEFAULT_EMAIL_FROM }}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  CELERY_CONCURRENCY=${{ vars.CELERY_CONCURRENCY }}
                  WORKER_SHELL_SHARED_SECRET=${{ secrets.WORKER_SHELL_SHARED_SECRET }}
                  EOF

            - name: Build and deploy workers only
              run: |
                  docker compose -f docker-compose-worker.yml build
                  docker compose -f docker-compose-worker.yml up -d --remove-orphans

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify workers deployment success
              run: echo "Workers deployment to development server successful!"
