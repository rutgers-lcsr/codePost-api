# CI Tests (API)
#
# Runs on:
#   - Push to main (day-to-day development)
#   - Push to release/* branches (cherry-picked hotfixes)
#   - Pull requests targeting main
#
# Jobs: commitlint (PRs only), djlint, pyright, pytest + coverage

name: Perform Codepost Tests

on:
    push:
        branches: [main, "release/*"]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    commitlint:
        name: Commit Messages
        runs-on: testing-codepost
        if: github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Install commitlint
              run: npm install @commitlint/cli @commitlint/config-conventional

            - name: Validate commit messages
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

    lint:
        name: Lint (djlint)
        runs-on: testing-codepost
        steps:
            - uses: actions/checkout@v5

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: poetry install --no-interaction

            - name: Run djlint on templates
              run: poetry run djlint core/templates/ --lint

    typecheck:
        name: Type Check (Pyright)
        runs-on: testing-codepost
        steps:
            - uses: actions/checkout@v5

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: poetry install --no-interaction

            - name: Run Pyright
              run: poetry run pyright

    test:
        name: Tests (pytest + coverage)
        runs-on: testing-codepost
        env:
            DEBUG: "TRUE"
            TESTING: "TRUE"
            CELERY_TASK_ALWAYS_EAGER: "TRUE"
            DJANGO_SETTINGS_MODULE: codepost.settings
        steps:
            - uses: actions/checkout@v5

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: poetry install --no-interaction

            - name: Run migrations
              run: poetry run python manage.py migrate --run-syncdb

            - name: Run tests with coverage
              run: poetry run coverage run -m pytest core/tests/ autograder/tests/ -v

            - name: Generate coverage report
              run: |
                  poetry run coverage report
                  poetry run coverage xml -o coverage.xml
                  poetry run coverage html -d htmlcov/

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: |
                      coverage.xml
                      htmlcov/
                  retention-days: 7
