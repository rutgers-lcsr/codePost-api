name: Perform Codepost Tests

on:
    push:
        branches: [master, render]
    pull_request:
        branches: [master, render]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (djlint)
        runs-on: testing-codepost
        steps:
            - uses: actions/checkout@v4

            - name: Set up virtual environment
              run: python3 -m venv .venv

            - name: Install dependencies
              run: |
                  .venv/bin/pip install --upgrade pip
                  .venv/bin/pip install -r requirements.txt

            - name: Run djlint on templates
              run: .venv/bin/djlint core/templates/ --lint

    typecheck:
        name: Type Check (Pyright)
        runs-on: testing-codepost
        steps:
            - uses: actions/checkout@v4

            - name: Set up virtual environment
              run: python3 -m venv .venv

            - name: Install dependencies
              run: |
                  .venv/bin/pip install --upgrade pip
                  .venv/bin/pip install -r requirements.txt

            - name: Run Pyright
              run: .venv/bin/pyright

    test:
        name: Tests (pytest + coverage)
        runs-on: testing-codepost
        env:
            DEBUG: "TRUE"
            TESTING: "TRUE"
            CELERY_TASK_ALWAYS_EAGER: "TRUE"
            DJANGO_SETTINGS_MODULE: codepost.settings
        steps:
            - uses: actions/checkout@v4

            - name: Set up virtual environment
              run: python3 -m venv .venv

            - name: Install dependencies
              run: |
                  .venv/bin/pip install --upgrade pip
                  .venv/bin/pip install -r requirements.txt

            - name: Run migrations
              run: .venv/bin/python manage.py migrate --run-syncdb

            - name: Run tests with coverage
              run: .venv/bin/coverage run -m pytest core/tests/ autograder/tests/ -v

            - name: Generate coverage report
              run: |
                  .venv/bin/coverage report
                  .venv/bin/coverage xml -o coverage.xml
                  .venv/bin/coverage html -o htmlcov/

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: |
                      coverage.xml
                      htmlcov/
                  retention-days: 7
