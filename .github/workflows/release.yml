name: Release

on:
    push:
        branches: [master]

concurrency:
    group: release-api
    cancel-in-progress: false

jobs:
    release:
        name: Semantic Release
        runs-on: testing-codepost
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: poetry install --no-interaction

            - name: Run semantic-release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: poetry run semantic-release publish

            # Trigger SDK regeneration in downstream repos (requires CROSS_REPO_TOKEN secret)
            - name: Get released version
              id: version
              run: |
                  VERSION=$(poetry run semantic-release version --print 2>/dev/null || echo "")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Trigger TypeScript client update
              if: steps.version.outputs.version != ''
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
              run: |
                  gh api repos/${{ github.repository_owner }}/codePost-ui/dispatches \
                    -f event_type=api-release \
                    -f 'client_payload[version]=v${{ steps.version.outputs.version }}' \
                    -f 'client_payload[schema_url]=https://codepost-api.cs.rutgers.edu/api/schema/'

            - name: Trigger Python SDK update
              if: steps.version.outputs.version != ''
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
              run: |
                  gh api repos/${{ github.repository_owner }}/codepost-python/dispatches \
                    -f event_type=api-release \
                    -f 'client_payload[version]=v${{ steps.version.outputs.version }}' \
                    -f 'client_payload[schema_url]=https://codepost-api.cs.rutgers.edu/api/schema/'
