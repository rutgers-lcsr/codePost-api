services:
    codepost-entry:
        image: nginx:latest
        container_name: codepost-entry
        volumes:
            - ./certs:/etc/ssl/certs
            - ./nginx.conf:/etc/nginx/nginx.conf
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - codepost-api
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
    codepost-api:
        container_name: codepost-api
        privileged: true
        env_file:
            - .env
        environment:
            - DEBUG=${DEBUG:-FALSE}
            - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
            - CELERY_BROKER_URL=redis://${DB_HOSTNAME}:6379
            - AUTOGRADER_AUTO_EXECUTE=True
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - DB_NAME=codepost
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_PORT=3306
            - DB_USERNAME=codepost_user
            - DB_PASSWORD=${DB_PASSWORD}
            - SECRET_KEY=${SECRET_KEY}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
            - EMAIL_HOST=${EMAIL_HOST}
            - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM}
            - HOST_STAGING_ROOT=/tmp/codepost-staging
            - WORKER_STAGING_ROOT=/staging
            - HOST_DATASET_ROOT=${HOST_DATASET_ROOT:-/mnt/datasets}
            - WORKER_DATASET_ROOT=/assignment_datasets
        ports:
            - "8000:8000"
        build:
            context: .
            target: api
        labels:
            - "autoheal=true"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://codepost-api:8000/health-check"]
            interval: 30s
            timeout: 10s
            retries: 5
        volumes:
            - ${HOST_DATASET_ROOT:-/mnt/datasets}:/assignment_datasets
            - /tmp/codepost-staging:/staging
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    codepost-autoheal:
        image: willfarrell/autoheal:latest
        container_name: codepost-autoheal
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

networks:
    default:
        name: codepost-network
        driver: bridge
