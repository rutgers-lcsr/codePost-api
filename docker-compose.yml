services:
    codepost-entry:
        image: nginx:latest
        container_name: codepost-entry
        volumes:
            - ./certs:/etc/ssl/certs
            - ./nginx.conf:/etc/nginx/nginx.conf
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - codepost-api
    codepost-api:
        container_name: codepost-api
        environment:
            - DEBUG=${DEBUG}
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - PYTHON_VERSION=3.8.17
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - MAILGUN_PASSWORD=${MAILGUN_PASSWORD}
            - MOOCS_API_URL=http://0.0.0.0:8000/api/moocs
            - ON_AWS=${ON_AWS}
            - PRODUCTION_MODE=${PRODUCTION_MODE}
            - SENDGRID_API_KEY=${SENDGRID_API_KEY}
            - STRIPE_API_KEY=${STRIPE_API_KEY}
            - STRIPE_NOTIFICATION_WEBHOOK_SECRET=${STRIPE_NOTIFICATION_WEBHOOK_SECRET}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            - RDS_DB_NAME=codepost
            - RDS_HOSTNAME=codepost-database
            - RDS_PORT=3306
            - RDS_USERNAME=codepost_user
            - RDS_PASSWORD=${DATABASE_PASSWORD}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
        ports:
            - "8000:8000"
        build:
            context: .
            target: api
        healthcheck:
            test: ["CMD", "curl", "-f", "http://codepost-api:8000/health-check"]
            interval: 30s
            timeout: 10s
            retries: 5
        depends_on:
            codepost-database:
                condition: service_healthy
            codepost-redis:
                condition: service_healthy
    codepost-worker:
        container_name: codepost-worker
        environment:
            - DEBUG=${DEBUG}
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - PYTHON_VERSION=3.8.17
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - MAILGUN_PASSWORD=${MAILGUN_PASSWORD}
            - MOOCS_API_URL=http://0.0.0.0:8000/api/moocs
            - ON_AWS=${ON_AWS}
            - PRODUCTION_MODE=${PRODUCTION_MODE}
            - SENDGRID_API_KEY=${SENDGRID_API_KEY}
            - STRIPE_API_KEY=${STRIPE_API_KEY}
            - STRIPE_NOTIFICATION_WEBHOOK_SECRET=${STRIPE_NOTIFICATION_WEBHOOK_SECRET}
            - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
            - RDS_DB_NAME=codepost
            - RDS_HOSTNAME=codepost-database
            - RDS_PORT=3306
            - RDS_USERNAME=codepost_user
            - RDS_PASSWORD=${DATABASE_PASSWORD}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
        build:
            context: .
            target: worker
        depends_on:
            - codepost-api
    codepost-flower:
        container_name: codepost-flower
        build:
            context: .
            target: flower
        ports:
            - "5555:5555"
        environment:
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - PYTHON_VERSION=3.8.17
        depends_on:
            - codepost-api
    codepost-redis:
        image: redis:latest
        container_name: codepost-redis
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 5
        volumes:
            - redis-data:/data
    codepost-database:
        image: mariadb:latest
        container_name: codepost-database
        environment:
            - MARIADB_ROOT_PASSWORD=${ROOT_DATABASE_PASSWORD}
            - MARIADB_DATABASE=codepost
            - MARIADB_USER=codepost_user
            - MARIADB_PASSWORD=${DATABASE_PASSWORD}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mariadb-admin", "ping", "-h", "codepost-database", "--silent", "--user=root", "--password=${ROOT_DATABASE_PASSWORD}"]
            interval: 30s
            timeout: 10s
            retries: 5

networks:
    default:
        name: codepost-network
        driver: bridge

volumes:
    redis-data:
        name: codepost-redis-data
        driver: local
    db-data:
        name: codepost-db-data
        driver: local
