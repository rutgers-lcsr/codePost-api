services:
    codepost-entry:
        image: nginx:latest
        container_name: codepost-entry
        volumes:
            - ./certs:/etc/ssl/certs
            - ./nginx.conf:/etc/nginx/nginx.conf
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - codepost-api
    codepost-api:
        container_name: codepost-api
        environment:
            - DEBUG=False
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - DB_NAME=codepost
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_PORT=${DB_PORT}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
            - EMAIL_HOST=${EMAIL_HOST}
            - EMAIL_PORT=${EMAIL_PORT}
            - EMAIL_USE_TLS=${EMAIL_USE_TLS}
            - EMAIL_USE_SSL=${EMAIL_USE_SSL}
            - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM}
        ports:
            - "8000:8000"
        build:
            context: .
            target: api
        healthcheck:
            test: ["CMD", "curl", "-f", "http://codepost-api:8000/health-check"]
            interval: 30s
            timeout: 10s
            retries: 5
        depends_on:
            codepost-redis:
                condition: service_healthy
    codepost-worker:
        container_name: codepost-worker
        environment:
            - DEBUG=False
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - API_URL=${API_URL}
            - CLIENT_URL=${CLIENT_URL}
            - DB_NAME=codepost
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_PORT=${DB_PORT}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - API_USER=${API_USER}
            - API_PASSWORD=${API_PASSWORD}
            - EMAIL_HOST=${EMAIL_HOST}
            - EMAIL_PORT=${EMAIL_PORT}
            - EMAIL_USE_TLS=${EMAIL_USE_TLS}
            - EMAIL_USE_SSL=${EMAIL_USE_SSL}
            - DEFAULT_EMAIL_FROM=${DEFAULT_EMAIL_FROM}
        build:
            context: .
            target: worker
        depends_on:
            - codepost-api
    codepost-flower:
        container_name: codepost-flower
        build:
            context: .
            target: flower
        ports:
            - "5555:5555"
        environment:
            - CELERY_BROKER_URL=redis://codepost-redis:6379
            - PYTHON_VERSION=3.8.17
        depends_on:
            - codepost-api
    codepost-redis:
        image: redis:latest
        container_name: codepost-redis
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 10s
            retries: 5
        volumes:
            - redis-data:/data

networks:
    default:
        name: codepost-network
        driver: bridge

volumes:
    redis-data:
        name: codepost-redis-data
        driver: local
