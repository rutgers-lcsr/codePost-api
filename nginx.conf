events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name localhost codepost-api.cs.rutgers.edu codepost-frontend codepost-entry dev-codepost-2.cs.rutgers.edu;
        http2  on;
        default_type  application/octet-stream;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        ssl_certificate /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/privkey.pem;
        client_max_body_size 6M;
        
        
        error_log /var/log/nginx/error.log debug;

        location /ws/ {
            proxy_pass http://codepost-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }

        location / {
            # Let Django handle CORS - don't add CORS headers in nginx
            proxy_pass http://codepost-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
     server {
        listen 80;
        server_name localhost codepost-api.cs.rutgers.edu codepost-frontend codepost-entry;
        return 301 https://$host$request_uri;
    }
}
