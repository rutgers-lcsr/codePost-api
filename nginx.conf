events {}

http {
    # Map to set CORS headers
    map $request_method $cors_method {
        OPTIONS 11;
        default 0;
    }
    
    server {
        listen 443 ssl;
        server_name localhost codepost-api.cs.rutgers.edu codepost-frontend codepost-entry dev-codepost-2.cs.rutgers.edu;
        http2  on;
        default_type  application/octet-stream;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        ssl_certificate /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/privkey.pem;
        
        error_log /var/log/nginx/error.log debug;

        location / {
                # Handle preflight OPTIONS requests directly
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            if ($request_method = OPTIONS) {
                    add_header 'Access-Control-Max-Age' 86400 always;
                    return 204;
            }
            
            proxy_pass http://codepost-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
     server {
        listen 80;
        server_name localhost codepost-api.cs.rutgers.edu codepost-frontend codepost-entry;
        return 301 https://$host$request_uri;
    }
}
