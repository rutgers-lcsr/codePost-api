[tool.poetry]
name = "codepost-api"
version = "4.0.0"
description = ""
authors = ["Mohamad Khawam mk1800@rutgers.edu"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "^3.13"
celery = "^5.6"
channels = "^4.1"
channels-redis = "^4.2"
django = "^6.0"
django-celery-results = "^2.6"
django-cors-headers = "^4.9"
django-encrypted-model-fields = "^0.6"
django-extensions = "^4.1"
django-filter = "^25.2"
django-viewflow = "^2.2"
djangorestframework = "^3.16"
djangorestframework-camel-case = "^1.4"
djangorestframework-simplejwt = "^5.5"
docker = "^7.1"
drf-spectacular = "^0.29"
esprima = "^4.0"
flower = "^2.0"
google-genai = "^1.65"
gunicorn = "^25.1"
haikunator = "^2.1"
httpx = "^0.28"
javalang = "^0.13"
jsonfield = "^3.2"
matplotlib = "^3.10"
mysqlclient = "2.2.7"
nbformat = "^5.10"
openai = "^2.24"
pyjwt = "^2.11"
pymupdf4llm = "^1.27"
pytz = "^2025.2"
redis = "^7.2"
requests = "^2.32"
structlog = "^25.4"
uvicorn = "^0.41"
whitenoise = "^6.12"
defusedxml = "^0.7"


[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
branch = "master"
commit_message = "chore(release): {version}"
changelog_file = "CHANGELOG.md"
build_command = ""
upload_to_pypi = false
tag_format = "v{version}"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.13,<9.0)",
    "django-stubs (>=5.2,<7.0)",
    "djangorestframework-stubs (>=3.16.8,<5.0)",
    "djlint (>=1.36,<3.0)",
    "factory-boy (>=3.3,<5.0)",
    "faker (>=40.0,<50.0)",
    "parameterized (>=0.9,<2.0)",
    "pipdeptree (>=2.0,<4.0)",
    "py-unused-deps (>=0.4,<2.0)",
    "pyright (>=1.1,<2.0)",
    "pytest (>=9.0,<10.0)",
    "pytest-django (>=4.12,<6.0)",
    "pytest-xdist (>=3.8,<5.0)",
    "python-semantic-release (>=9.0,<11.0)"
]
