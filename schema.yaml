    PatchedAssignment:
      type: object
      description: Assignment Serializer from which all other Assignment Serializer
        subclasses inherit from
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: The name of the assignment.
          maxLength: 32
        isReleased:
          type: boolean
          description: A boolean field. 'True' if the assignment is released for students
            to view. 'False' otherwise.
        feedbackReleased:
          type: boolean
          description: A boolean field. 'True' if grades/feedback are released for
            students to view. 'False' otherwise.
        course:
          type: integer
          description: The related course_id.
        rubricCategories:
          type: array
          items:
            type: integer
          readOnly: true
        allowStudentUpload:
          type: boolean
          description: A boolean field. If true, students will be allowed to upload
            submissions until the upload due date.
        allowStudentUploadWithPartners:
          type: boolean
          description: A boolean field. If true, students will be allowed to invite
            partners to their submission.
        uploadDueDate:
          type: string
          format: date-time
          nullable: true
          description: The date after which students are not allowed to upload submissions.
            Only useful if allowStudentUpload is set to True.
        maxLateDays:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: An integer representing the maximum number of late days to
            continue to accept submissions for this assignment.
        liveFeedbackMode:
          type: boolean
          description: A boolean field. If true, students can see their submission
            and comments before finalization and published
        allowLateUploads:
          type: boolean
          description: A boolean field. If True and an uploadDueDate is set, students
            will still be able to submit after a deadline has passed.
        environment:
          type: integer
          readOnly: true
        files:
          type: array
          items:
            type: integer
          readOnly: true
        fileTemplates:
          type: array
          items:
            type: integer
          readOnly: true
        maxStudentTestRuns:
          type: integer
          nullable: true
          readOnly: true
        sortKey:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Optional integer to specify the order of a Course's Assignments.
        explanation:
          type: string
          description: The explanation of an assignment, visible to students.
        isVisible:
          type: boolean
          description: A boolean field. 'True' if the assignment is viewable by students.
        hideFrom:
          type: array
          items:
            type: integer
            title: HideFrom
          description: Sections from which to hide this assignment.
        nudgeMode:
          type: boolean
          readOnly: true
        lateDeductions:
          default: []
        studentsCanSeeGraders:
          type: boolean
          nullable: true
          description: If set, overrides course setting. If True, students can see
            graders for this assignment.
        dataSets:
          type: array
          items:
            type: integer
          readOnly: true
        points:
          type: number
          format: double
          maximum: 1000
          minimum: 0
          exclusiveMaximum: true
          description: Total points for the assignment.
        hideGrades:
          type: boolean
          description: A boolean field. 'True' if the students should not see their
            grades for this assignment. 'False' otherwise.
        anonymousGrading:
          type: boolean
          description: A boolean field. If 'True', graders will not have access to
            the students field of submission objects, unless they have elevated privileges.
        hideGradersFromStudents:
          type: boolean
          description: A boolean field. If True, the graders of a submission will
            be hidden from students.
        commentFeedback:
          type: boolean
          description: A boolean field. If True, students can provide feedback on
            rubric comments.
        additiveGrading:
          type: boolean
          description: A boolean field. If true, grades begin at 0 (instead of assignment.points)
        allowRegradeRequests:
          type: boolean
          description: A boolean field. If True, students will be allowed to submit
            questions and regrade requests after their submission has been graded.
        regradeInstructions:
          type: string
          description: Instructions (in Markdown) to show students when they submit
            regrade requests.
        regradeDeadline:
          type: string
          format: date-time
          nullable: true
          description: The date after which students are not allowed submit a regrade
            request.
        forcedRubricMode:
          type: boolean
          description: A boolean field. If true, graders will be required to link
            a rubric comment on all comments.
        templateMode:
          type: boolean
          description: A boolean field. If true, admins will be able upload template
            code files. Those template files will be used to de-emphasize provided
            versus student-written code in submissions.
        collaborativeRubricMode:
          type: boolean
          description: A boolean field. If true, admins and graders can edit the assignment
            rubric inline in the code console.
        gradersCanEditSubmissions:
          type: boolean
          description: A boolean field. If True, graders will be allowed to edit student
            submissions (e.g. for testing fixes).
        testCategories:
          type: array
          items:
            type: integer
          readOnly: true
        showFrequentlyUsedRubricComments:
          type: boolean
          description: A boolean field. If true, an assignment's 10 most frequently
            used rubric comments will be shown within the code console.
        ai_system_prompt:
          type: string
          description: 'System prompt for AI comment generation. Placeholders: {assignment_name},
            {file_content}, {selected_content}, {rubric_context}, {grader_draft}'
        runFilesOnSubmit:
          type: boolean
          description: If True, submission files will be automatically executed and
            cached when a student submits.
        runTestsOnSubmit:
          type: boolean
          description: If True, autograder tests will automatically run when a student
            submits.
        testsAffectGrade:
          type: boolean
          description: If True, the results of autograder tests will be included in
            the submission grade calculation.
