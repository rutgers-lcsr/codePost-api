          type: boolean
          description: A boolean field. If True, graders will be allowed to add and
            update unlinked rubric comments.
        minComments:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: An integer representing the minimum number of comments that
            graders are asked to make prior to finalizing. 0 indicates no minimum.
        noUnfinalize:
          type: boolean
          description: If True, only admins can unfinalize submissions.
        archived:
